name: Deploy Frontend to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY || 'hnxcis' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'hnxcis-frontend' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SA }}
  # URL of the backend Cloud Run service, injected into /env.js at container
  # start — changing it needs no rebuild, only a new revision.
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  # Defaults to 'false': the bof-intern org enforces a Domain Restricted Sharing
  # policy (constraints/iam.allowedPolicyMemberDomains) that blocks granting
  # allUsers access, so `--allow-unauthenticated` cannot actually take effect here.
  # Flip to 'true' (repository variable) once that policy has an exception for
  # this project/service — note the public portal (PublicCorporateNews) needs
  # real anonymous visitors to reach the service, so this is a stop-gap, not a
  # long-term state.
  ALLOW_UNAUTHENTICATED: ${{ vars.ALLOW_UNAUTHENTICATED || 'false' }}
  WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          missing=""
          if [ -z "${PROJECT_ID:-}" ]; then
            missing="$missing GCP_PROJECT_ID(vars)"
          fi
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::warning::API_BASE_URL (repository variable) is empty — the SPA will call its own origin and API requests will 404."
          fi
          if [ -z "${WIF_PROVIDER:-}" ] && [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER-or-GCP_SA_KEY(secrets)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required configuration:$missing"
            exit 1
          fi

          # Surface the resolved project so a shadowed value is caught immediately
          # instead of failing later inside `gcloud run deploy`. NOTE: this job runs
          # under `environment: ${{ github.event.inputs.environment || 'production' }}`
          # — if a GitHub Environment of that name defines its own `GCP_PROJECT_ID`
          # variable, it silently overrides the repository-level variable of the same
          # name. If PROJECT_ID below isn't what you set at the repo level, check
          # Settings → Environments → ${{ github.event.inputs.environment || 'production' }} → Variables.
          echo "Resolved GCP project: ${PROJECT_ID}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      # --- Authenticate to Google Cloud -------------------------------------
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Authenticate to Google Cloud (service account key)
        if: env.WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Compute image tags
        id: image
        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE_NAME}"
          echo "sha_tag=${BASE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.image.outputs.sha_tag }}" \
            -t "${{ steps.image.outputs.latest_tag }}" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.sha_tag }}"
          docker push "${{ steps.image.outputs.latest_tag }}"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -euo pipefail

          ENV_VARS="^##^APP_ENV=production"
          if [ -n "${API_BASE_URL:-}" ]; then
            ENV_VARS="${ENV_VARS}##API_BASE_URL=${API_BASE_URL}"
          fi

          ARGS=(
            "${SERVICE_NAME}"
            --image "${{ steps.image.outputs.sha_tag }}"
            --project "${PROJECT_ID}"
            --region "${REGION}"
            --platform managed
            --port 8080
            --cpu 1
            --memory 256Mi
            --timeout 60
            --min-instances "${{ vars.MIN_INSTANCES || '0' }}"
            --max-instances "${{ vars.MAX_INSTANCES || '10' }}"
            --set-env-vars "${ENV_VARS}"
            --quiet
          )

          if [ -n "${RUNTIME_SERVICE_ACCOUNT:-}" ]; then
            ARGS+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi

          if [ "${ALLOW_UNAUTHENTICATED}" = "true" ]; then
            ARGS+=(--allow-unauthenticated)
          else
            ARGS+=(--no-allow-unauthenticated)
          fi

          gcloud run deploy "${ARGS[@]}"

          # NOTE: the deploying identity only has enough permission to deploy
          # revisions (run.services.update et al.) — it does NOT have
          # run.services.setIamPolicy, so this workflow cannot manage IAM
          # bindings on the service itself (confirmed by a PERMISSION_DENIED
          # from `gcloud run services add-iam-policy-binding` when this was
          # tried). `--allow-unauthenticated`/`--no-allow-unauthenticated` above
          # is deploy's own best-effort attempt at the binding and only warns on
          # failure rather than failing the job. If ${SERVICE_NAME} needs to
          # actually be reachable — by real anonymous visitors when
          # ALLOW_UNAUTHENTICATED=true, or by this workflow's own health check
          # when it's false — a project/org admin needs to run one of these
          # ONE-TIME (not per-deploy) commands out of band:
          #   gcloud run services add-iam-policy-binding "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --member=allUsers --role=roles/run.invoker
          #   gcloud run services add-iam-policy-binding "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --member="serviceAccount:<deployer-sa-email>" --role=roles/run.invoker
          # (the former needs a Domain Restricted Sharing exception in this org; the latter just needs an admin with run.services.setIamPolicy.)
          gcloud run services get-iam-policy "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" || true

          URL="$(gcloud run services describe "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Verify the SPA is served
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"

          # When the service requires authentication (ALLOW_UNAUTHENTICATED=false),
          # anonymous requests never reach the container — Cloud Run/Google's edge
          # returns a generic 404 instead. Try an identity token scoped to this
          # service's URL, in case an admin has separately granted this CI identity
          # roles/run.invoker — but this workflow cannot grant that binding itself
          # (see the comment in "Deploy to Cloud Run"), so treat an HTTP-level
          # check as best-effort here rather than a hard gate: `gcloud run deploy`
          # already blocked until the revision was Ready and serving 100% of
          # traffic, which is the real confirmation the container started
          # correctly. A remaining 403/404 below just means this identity isn't
          # (yet) authorized to call the service — not that the deploy is broken.
          REQUIRE_HTTP_CHECK=true
          AUTH_HEADER=()
          if [ "${ALLOW_UNAUTHENTICATED}" != "true" ]; then
            REQUIRE_HTTP_CHECK=false
            ID_TOKEN="$(gcloud auth print-identity-token --audiences="${URL}" 2>/dev/null || echo "")"
            if [ -n "${ID_TOKEN}" ]; then
              AUTH_HEADER=(-H "Authorization: Bearer ${ID_TOKEN}")
            fi
          fi

          # A brand-new Cloud Run service gets a freshly-minted *.run.app hostname;
          # Google's edge routing/TLS for that hostname can take a couple of minutes
          # to propagate globally even though `gcloud run deploy` already reports the
          # new revision as ready and serving 100% traffic. Requests during that
          # window come back 404 (not 5xx/timeout). Subsequent deploys reuse the same
          # hostname and are typically ready immediately, so this mostly affects the
          # very first deploy of a given service.
          # In the best-effort (private-service) branch there's no propagation
          # delay worth waiting out — without an invoker grant every attempt
          # fails the same way — so use a short budget instead of the full 5min.
          if [ "${REQUIRE_HTTP_CHECK}" = "true" ]; then
            ATTEMPTS=30
            SLEEP_SECONDS=10
          else
            ATTEMPTS=3
            SLEEP_SECONDS=5
          fi
          for i in $(seq 1 "${ATTEMPTS}"); do
            healthz_code="$(curl -s -o /dev/null -w '%{http_code}' "${AUTH_HEADER[@]}" "${URL}/healthz" || echo "000")"
            envjs_code="$(curl -s -o /dev/null -w '%{http_code}' "${AUTH_HEADER[@]}" "${URL}/env.js" || echo "000")"
            if [ "${healthz_code}" = "200" ] && [ "${envjs_code}" = "200" ]; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "Attempt ${i}/${ATTEMPTS}: /healthz=${healthz_code} /env.js=${envjs_code}, retrying in ${SLEEP_SECONDS}s..."
            sleep "${SLEEP_SECONDS}"
          done

          echo "--- Last response from ${URL}/healthz ---"
          curl -sS -i "${AUTH_HEADER[@]}" "${URL}/healthz" || true

          if [ "${REQUIRE_HTTP_CHECK}" = "true" ]; then
            echo "::error::Health check failed for ${URL} after $((ATTEMPTS * SLEEP_SECONDS))s"
            exit 1
          fi

          echo "::warning::Could not confirm ${URL}/healthz over HTTP — this CI identity likely isn't granted roles/run.invoker on ${SERVICE_NAME} (ALLOW_UNAUTHENTICATED=false and this workflow cannot self-grant that binding). Treating the earlier 'gcloud run deploy' success (revision Ready, serving 100% traffic) as the health signal instead."

      - name: Summary
        run: |
          {
            echo "### Frontend deployed :rocket:"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Service | \`${SERVICE_NAME}\` |"
            echo "| Region | \`${REGION}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Image | \`${{ steps.image.outputs.sha_tag }}\` |"
            echo "| Backend API | \`${API_BASE_URL:-same origin}\` |"
            echo "| Public access | \`${ALLOW_UNAUTHENTICATED}\`$( [ "${ALLOW_UNAUTHENTICATED}" != "true" ] && echo ' — **requires auth, real anonymous visitors cannot reach it yet**' ) |"
          } >> "$GITHUB_STEP_SUMMARY"
